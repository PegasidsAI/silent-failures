name: self-test

# The self-test is the claim this repository makes about itself: 57 cases, of
# which 34 must not come out green. Running it here means the claim is checked
# rather than asserted — which is, after all, the whole argument.
#
# These two numbers were wrong for days. The check that guards them read the
# two READMEs and not this file, so the drift happened in the comment above the
# check that exists to prevent drift. It now scans every file that mentions the
# self-test, because a denominator chosen by hand is the first incident here.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  self-test:
    name: ${{ matrix.os }} · Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.9", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # 57 cases. 34 of them must fail, skip, or be rejected as a bad spec;
      # the run exits non-zero if any of those comes out green.
      - name: Self-test
        run: python tool/effect_check.py selftest

      # The example a newcomer runs first. It must pass.
      - name: The worked example passes
        working-directory: examples/minimal
        run: python ../../tool/effect_check.py run minimal.json -- python job.py

      # And it must FAIL against a job that produces nothing while printing the
      # same log line and exiting zero. A green result here would be the exact
      # failure this repository documents, so the step inverts the exit code.
      - name: The worked example FAILS when the job produces nothing
        working-directory: examples/minimal
        shell: bash
        run: |
          if python ../../tool/effect_check.py run minimal.json -- python broken_job.py; then
            echo "::error::The checker passed a job that produced nothing."
            exit 1
          fi
          echo "Correctly reported a failure."

  documented-numbers:
    name: the documented counts match the code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # Both READMEs state how many cases the self-test runs and how many of
      # them must not be green. Those numbers drifted within hours of being
      # written, because cases were added and the prose was not. Documentation
      # that describes a state which no longer holds is the second incident in
      # this archive; it does not get to happen on its own front page.
      - name: Compare the stated counts against a real run
        run: python .github/check_documented_counts.py

  plugin-manifest:
    name: the plugin manifest points at things that exist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # A manifest is a set of claims — this plugin lives at this path, this
      # command runs that script — and every one of them can be wrong while the
      # JSON stays valid. The failure then looks like a plugin that installs
      # cleanly and quietly does nothing, which is the whole subject here.
      - name: Re-derive the manifest claims from the files on disk
        run: python .github/check_plugin_manifest.py

      # And the checker itself gets the same treatment the tool does: broken on
      # purpose, one thing at a time, against a copy. It passed a plugin with
      # every skill and command deleted until this existed.
      - name: The manifest checker refuses what it should refuse
        run: python .github/check_plugin_manifest_selftest.py
